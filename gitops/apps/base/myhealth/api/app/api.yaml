# OLLAMA_BASE_URL is set by each overlay, because Ollama runs on the Minikube host or in the homelab cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: health-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: myhealth-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROFILE
              value: local
            - name: QDRANT_URL
              value: http://qdrant.myhealth.svc.cluster.local:6333
            - name: OLLAMA_CHAT_MODEL
              value: llama3.1
            - name: OLLAMA_EMBED_MODEL
              value: nomic-embed-text
            - name: DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: health-data
              mountPath: /data
      volumes:
        - name: health-data
          persistentVolumeClaim:
            claimName: health-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
