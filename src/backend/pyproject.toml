[project]
name = "health-api"
version = "0.1.0"
description = "Local API that stores medical PDFs and answers from them."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.5",
    "pypdf>=6.21.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
local = [
    "docling>=2.143.1",
    "qdrant-client>=1.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: one module in process, no TestClient and no external service",
    "acceptance: in-process TestClient against the stub app; no Docker and no network",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
