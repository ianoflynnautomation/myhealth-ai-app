name: CI Main Delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitattributes"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect_changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/detect-changes@a9bc3cb4b8ea83909408c94409b9de360160b96b  # v1.8.0
        with:
          filters: .github/path-filters.yml

  frontend_unit:
    name: Frontend Unit Tests
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Unit Tests
      working-directory: src/frontend
      container-image: node:26-bookworm-slim
      cache-key-prefix: myhealth-frontend
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: |
        mkdir -p test-results
        npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-unit.xml
      artifact-name: frontend-vitest-unit
      artifact-path: |
        src/frontend/test-results/vitest-unit.xml
        src/frontend/coverage/
      artifact-if-no-files-found: error
      upload-artifact-always: true
      artifact-retention-days: 14

  frontend_build:
    name: Frontend Build
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'frontend')
    permissions:
      contents: read
      actions: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/node-build-test.yml@f69cd6a0c7977cb516ae8f7fe8fbdb1b7c1bc0a1  # npm download cache
    with:
      job-name: Frontend Build
      working-directory: src/frontend
      container-image: node:26-bookworm-slim
      cache-key-prefix: myhealth-frontend
      timeout-minutes: 15
      env-vars: |
        HUSKY=0
      commands: npm run build

  backend_unit:
    name: Backend Unit Tests
    needs: detect_changes
    if: contains(fromJSON(needs.detect_changes.outputs.changes), 'backend')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: Sync dependencies
        working-directory: src/backend
        run: uv sync --frozen
      - name: Test
        working-directory: src/backend
        run: |
          mkdir -p test-results
          uv run pytest --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-pytest
          path: src/backend/test-results/pytest.xml
          if-no-files-found: error
          retention-days: 14

  main_complete:
    name: Main Delivery Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - detect_changes
      - frontend_unit
      - frontend_build
      - backend_unit
    steps:
      - name: Verify all required main-branch jobs succeeded or were intentionally skipped
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/check-required-jobs@a9bc3cb4b8ea83909408c94409b9de360160b96b  # v1.8.0
        with:
          needs-json: ${{ toJson(needs) }}
          summary-title: Main delivery
