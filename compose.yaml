services:
  web:
    image: myhealth-web:local
    pull_policy: if_not_present
    build:
      context: ./src/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  api:
    image: myhealth-api:local
    pull_policy: if_not_present
    build:
      context: ./src/backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROFILE: local
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_CHAT_MODEL: llama3.1
      OLLAMA_EMBED_MODEL: nomic-embed-text
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - qdrant
      - ollama

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.40.11
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  qdrant-data:
  ollama-models:
