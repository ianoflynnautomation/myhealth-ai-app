# Minikube profile myhealth. The models stay on the host, so this overlay has no Ollama component.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/myhealth
  - ../../base/myhealth/qdrant/ks.yaml
  - ../../base/myhealth/api/ks.yaml
  - ../../base/myhealth/web/ks.yaml
patches:
  - path: api-patch.yaml
