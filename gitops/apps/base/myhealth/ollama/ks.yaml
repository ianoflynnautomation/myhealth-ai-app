# Homelab only. The first install pulls both models, so it gets a longer timeout.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 10m
  timeout: 30m
  path: ./gitops/apps/base/myhealth/ollama/app
  targetNamespace: myhealth
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
