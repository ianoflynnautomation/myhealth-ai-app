# Chart 1.20.0 ships Qdrant v1.20.0, the same image compose.yaml pins.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
spec:
  interval: 30m
  releaseName: qdrant
  chart:
    spec:
      chart: qdrant
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: qdrant
  values:
    replicaCount: 1
